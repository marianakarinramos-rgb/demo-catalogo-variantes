<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Mayorista | Hippie Zapatos</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: 'var(--brand-bg)',      
                            card: '#FFFFFF',    
                            text: 'var(--brand-text)',    
                            accent: 'var(--brand-accent)',  
                            border: 'var(--brand-border)'   
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-bg: #F9F6F0;
            --brand-text: #4A3B32;
            --brand-accent: #7B3F32;
            --brand-border: #E6DFD5;
        }

        body { background-color: var(--brand-bg); color: var(--brand-text); overflow-x: hidden; transition: background-color 0.3s, color 0.3s; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--brand-border); border-radius: 4px; }
        
        body.modo-admin #vista-tienda { display: none !important; }
        body.modo-admin #vista-admin { display: flex !important; }
        
        #vista-tienda { display: flex; flex-direction: column; min-height: 100vh; }
        #vista-admin { display: none; flex-direction: column; min-height: 100vh; background-color: var(--brand-bg); color: var(--brand-text); font-family: 'Inter', sans-serif;}

        .size-selector input[type="radio"] { display: none; }
        .size-selector label {
            display: inline-flex; justify-content: center; align-items: center;
            width: 30px; height: 30px; border: 1px solid var(--brand-border);
            border-radius: 4px; cursor: pointer; transition: all 0.2s;
            font-size: 11px; font-weight: 600; color: var(--brand-text);
            background-color: white;
        }
        .size-selector input[type="radio"]:checked + label {
            background-color: var(--brand-accent);
            color: white; border-color: var(--brand-accent);
        }

        .color-selector input[type="radio"] { display: none; }
        .color-selector label {
            display: inline-block; padding: 2px 8px; border: 1px solid var(--brand-border);
            border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 10px; font-weight: 600; background: white; color: var(--brand-text);
        }
        .color-selector input[type="radio"]:checked + label { background-color: var(--brand-accent); color: white; border-color: var(--brand-accent); }

        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 24px; border-radius: 4px; font-weight: 600; box-shadow: 0 4px 15px rgba(0,0,0,0.1); animation: slideIn 0.3s forwards; background: var(--brand-text); color: white; font-size: 12px; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="font-sans antialiased pb-24">

    <div id="carga-overlay" class="fixed inset-0 bg-brand-text/80 hidden items-center justify-center z-[99999] backdrop-blur-sm">
        <div class="text-center">
            <i class="fas fa-circle-notch fa-spin text-4xl text-brand-bg mb-3"></i>
            <p class="text-brand-bg font-bold text-sm tracking-widest uppercase">Procesando...</p>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- 1. VISTA TIENDA -->
    <!-- ============================================== -->
    <div id="vista-tienda">
        <header class="bg-white border-b border-brand-border sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-4 cursor-pointer select-none" onclick="triggerAdminSecret()" title="Catálogo Oficial">
                    <div class="w-12 h-12 rounded-full border-2 border-brand-border flex items-center justify-center overflow-hidden bg-brand-bg">
                        <span class="font-serif font-bold text-xl leading-none text-brand-text">HZ</span>
                    </div>
                    <div>
                        <h1 class="font-serif text-2xl text-brand-text leading-none">Hippie Zapatos</h1>
                        <span class="text-[10px] uppercase tracking-widest text-brand-text/60 font-bold">Venta Mayorista</span>
                    </div>
                </div>
                
                <button onclick="toggleCart()" class="relative bg-brand-accent text-white w-11 h-11 rounded-full flex items-center justify-center hover:opacity-90 transition shadow-sm">
                    <i class="fas fa-shopping-cart text-lg"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-black text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full hidden">0</span>
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-6 py-8">
            <div class="mb-8 max-w-lg mx-auto relative">
                <i class="fas fa-search absolute left-4 top-3.5 text-brand-text/40"></i>
                <input type="text" id="buscador" oninput="renderProductos()" placeholder="Buscá por SKU o nombre..." class="w-full bg-white border border-brand-border text-brand-text pl-11 pr-4 py-3 rounded-lg outline-none focus:border-brand-accent transition shadow-sm text-sm font-medium">
            </div>
            
            <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5"></div>
        </main>
    </div>

    <!-- Sidebar Carrito -->
    <div id="modal-carrito" class="fixed inset-y-0 right-0 w-full md:w-[400px] bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col border-l border-brand-border">
        <div class="p-5 border-b border-brand-border flex justify-between items-center bg-brand-bg">
            <h3 class="font-serif text-xl text-brand-text">Tu Pedido Mayorista</h3>
            <button onclick="toggleCart()" class="text-brand-text/50 hover:text-brand-accent text-xl"><i class="fas fa-times"></i></button>
        </div>
        <div class="flex-grow overflow-y-auto p-5 space-y-4 bg-stone-50" id="lista-carrito"></div>
        <div class="p-5 border-t border-brand-border bg-white">
            <div class="mb-4 space-y-3">
                <input type="text" id="cli-nombre" placeholder="Nombre de tu Local *" class="w-full border border-brand-border p-3 rounded-lg text-sm outline-none focus:border-brand-accent">
                <input type="text" id="cli-tel" placeholder="Tu WhatsApp *" class="w-full border border-brand-border p-3 rounded-lg text-sm outline-none focus:border-brand-accent">
            </div>
            <div class="flex justify-between items-end mb-4 pt-4 border-t border-brand-border">
                <span class="text-[10px] uppercase tracking-widest font-bold text-brand-text/60">Total Estimado</span>
                <h3 class="text-2xl font-serif text-brand-accent" id="total-carrito">$0</h3>
            </div>
            <button onclick="enviarPedido()" class="w-full bg-brand-accent hover:opacity-90 text-white py-3.5 rounded-lg font-bold shadow-md transition text-sm tracking-wider uppercase flex justify-center items-center gap-2">
                <i class="fab fa-whatsapp text-lg"></i> Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>
    <div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/40 z-40 hidden backdrop-blur-sm transition-opacity"></div>

    <!-- ============================================== -->
    <!-- 2. VISTA ADMIN -->
    <!-- ============================================== -->
    <div id="vista-admin">
        <header class="bg-white border-b border-brand-border px-6 py-4 flex flex-col md:flex-row justify-between items-center shadow-sm gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-accent text-white rounded-lg flex items-center justify-center text-lg"><i class="fas fa-sliders-h"></i></div>
                <div>
                    <h2 class="font-serif text-xl text-brand-text leading-tight">Gestión Multi-Canal</h2>
                    <span class="text-[10px] text-brand-text/60 font-bold uppercase tracking-widest">Panel Autónomo de Fábrica</span>
                </div>
            </div>
            <div class="flex gap-2">
                <a href="./" target="_blank" class="bg-brand-bg hover:bg-brand-border text-brand-text border border-brand-border px-4 py-2.5 rounded-lg text-xs font-bold transition flex items-center shadow-sm">
                    <i class="fas fa-external-link-alt mr-2"></i> Ver Tienda al Lado
                </a>
                <button onclick="cerrarSesion()" class="bg-brand-accent text-white px-4 py-2.5 rounded-lg text-xs font-bold transition flex items-center shadow-sm">
                    <i class="fas fa-eye mr-2"></i> Ocultar Admin
                </button>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto w-full p-6 space-y-6">
            <div class="bg-white border border-brand-border rounded-xl p-6 shadow-sm flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-2">
                    <button onclick="generarExcelMuestra()" class="bg-stone-100 hover:bg-stone-200 text-brand-text px-4 py-2.5 rounded-lg text-xs font-bold transition flex items-center border border-brand-border">
                        <i class="fas fa-download mr-2 text-brand-accent"></i> Descargar Plantilla Excel
                    </button>
                    <label class="bg-green-600 hover:bg-green-700 text-white px-4 py-2.5 rounded-lg text-xs font-bold transition cursor-pointer flex items-center shadow-sm">
                        <i class="fas fa-file-excel mr-2"></i> Subir Excel
                        <input type="file" accept=".xlsx" class="hidden" onchange="importarExcel(event)">
                    </label>
                    <button onclick="vaciarDB()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2.5 rounded-lg text-xs font-bold transition flex items-center border border-red-200">
                        <i class="fas fa-trash-alt mr-2"></i> Vaciar
                    </button>
                </div>
                
                <div class="bg-brand-bg border border-brand-border p-3 rounded-lg flex items-center gap-3">
                    <div class="text-xs">
                        <span class="font-bold block text-brand-text">Subida Masiva de Fotos</span>
                        <span class="text-[10px] text-brand-text/60">Nombradas con el SKU (ej: 1.jpg)</span>
                    </div>
                    <label class="bg-brand-accent hover:opacity-90 text-white px-3 py-2 rounded-md text-xs font-bold cursor-pointer transition shadow-sm">
                        <i class="fas fa-images mr-1"></i> Seleccionar Imágenes
                        <input type="file" id="input-fotos-masivas" accept="image/*" multiple class="hidden" onchange="subirFotosMasivas(event)">
                    </label>
                </div>
            </div>

            <div class="bg-white border border-brand-border rounded-xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-brand-text">
                        <thead class="bg-stone-50 text-brand-text/60 font-semibold border-b border-brand-border text-[11px] uppercase tracking-wider">
                            <tr>
                                <th class="px-4 py-3 w-20">Foto</th>
                                <th class="px-4 py-3 w-20">SKU</th>
                                <th class="px-4 py-3">Producto</th>
                                <th class="px-4 py-3 text-right">Precio Mayorista</th>
                                <th class="px-4 py-3">Talles & Colores</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-admin" class="divide-y divide-brand-border/40"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>

    <script>
        let db = { productos: [] };
        
        try { 
            const s = localStorage.getItem('gesto_hippie_v3'); 
            if(s) { const p = JSON.parse(s); if(p.productos && p.productos.length > 0) db = p; } 
        } catch(e){}

        if(db.productos.length === 0) {
            db.productos = [
                {
                    id: '1', sku: '1', nombre: 'Zuecos Mules Gamuza Con Hebilla Estribo Suela', precioBase: 50000,
                    talles: [35, 36, 37, 38, 39, 40, 41],
                    colores: [
                        { id: 'c1', nombre: 'Suela', img: '' },
                        { id: 'c2', nombre: 'Beige', img: '' }
                    ]
                }
            ];
        }

        function salvar() { localStorage.setItem('gesto_hippie_v3', JSON.stringify(db)); }

        let carrito = [];
        let seleccionActual = {}; 
        let clicksAdmin = 0;
        let adminTimer = null;

        function triggerAdminSecret() {
            clicksAdmin++;
            if(adminTimer) clearTimeout(adminTimer);
            if(clicksAdmin >= 3) {
                clicksAdmin = 0;
                document.body.classList.add('modo-admin');
                toast('🔓 Panel Admin abierto');
                return;
            }
            adminTimer = setTimeout(() => { clicksAdmin = 0; }, 600);
        }

        const formatMoney = (monto) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(monto);

        function init() {
            db.productos.forEach(p => {
                if(p.colores && p.colores.length > 0 && p.talles && p.talles.length > 0) {
                    if(!seleccionActual[p.id]) {
                        seleccionActual[p.id] = { color: p.colores[0].id, talle: p.talles[0], qty: 1 };
                    }
                }
            });
            renderProductos();
            renderStockAdmin();
        }

        function renderProductos() {
            const grid = document.getElementById('grid-productos');
            const term = document.getElementById('buscador').value.toLowerCase();
            const filtrados = db.productos.filter(p => p.nombre.toLowerCase().includes(term) || p.sku.toLowerCase().includes(term));

            grid.innerHTML = filtrados.length ? filtrados.map(p => {
                if(!seleccionActual[p.id]) {
                    seleccionActual[p.id] = { color: p.colores[0].id, talle: p.talles[0], qty: 1 };
                }
                const state = seleccionActual[p.id];
                const colorActivo = p.colores.find(c => c.id === state.color) || p.colores[0];
                const imgFinal = colorActivo.img || p.colores[0].img || `https://via.placeholder.com/400/E6DFD5/4A3B32?text=SKU+${p.sku}`;
                
                return `
                <div class="bg-white border border-brand-border rounded-xl shadow-sm overflow-hidden flex flex-col">
                    <div class="aspect-[4/5] bg-stone-100 relative overflow-hidden border-b border-brand-border">
                        <img src="${imgFinal}" alt="${p.nombre}" class="w-full h-full object-cover transition-all duration-300" id="img-prod-${p.id}">
                    </div>
                    
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[9px] bg-stone-100 text-brand-text font-bold px-2 py-0.5 rounded uppercase border border-brand-border">Zuecos</span>
                                <span class="text-[9px] text-brand-text/50 font-bold">SKU: ${p.sku}</span>
                            </div>
                            <h2 class="font-sans text-xs font-bold text-brand-text mb-2 leading-snug line-clamp-2">${p.nombre}</h2>
                            
                            <!-- Selector de Variantes de Colores -->
                            ${p.colores.length > 1 ? `
                            <div class="mb-2">
                                <span class="text-[9px] uppercase tracking-widest text-brand-text/60 font-bold block mb-1">Color: <span class="text-brand-accent">${colorActivo.nombre}</span></span>
                                <div class="flex gap-1 color-selector flex-wrap">
                                    ${p.colores.map(c => `
                                        <div>
                                            <input type="radio" name="color-${p.id}" id="col-${p.id}-${c.id}" value="${c.id}" ${c.id === state.color ? 'checked' : ''} onchange="cambiarColor('${p.id}', '${c.id}', '${c.img || p.colores[0].img}')">
                                            <label for="col-${p.id}-${c.id}">${c.nombre}</label>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>` : ''}

                            <!-- Talles -->
                            <div class="mb-3">
                                <span class="text-[9px] uppercase tracking-widest text-brand-text/60 font-bold block mb-1">Talles</span>
                                <div class="flex gap-1 size-selector flex-wrap">
                                    ${p.talles.map(t => `
                                        <div>
                                            <input type="radio" name="talle-${p.id}" id="tal-${p.id}-${t}" value="${t}" ${t === state.talle ? 'checked' : ''} onchange="cambiarTalle('${p.id}', '${t}')">
                                            <label for="tal-${p.id}-${t}">${t}</label>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="mb-2 flex items-center justify-between border-t border-brand-border pt-2">
                                <span class="text-[10px] font-bold text-gray-400 uppercase">Precio</span>
                                <span class="text-base font-black text-brand-accent">${formatMoney(p.precioBase)}</span>
                            </div>
                            <button onclick="addCart('${p.id}')" class="w-full bg-brand-accent hover:opacity-90 text-white font-bold text-xs py-2.5 rounded-lg uppercase tracking-wider transition shadow-sm flex items-center justify-center gap-2">
                                <i class="fas fa-cart-plus"></i> Agregar
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('') : '<div class="col-span-full py-20 text-center text-brand-text/40 font-serif text-xl">Sin resultados...</div>';
        }

        function cambiarColor(prodId, colorId, imgUrl) {
            seleccionActual[prodId].color = colorId;
            const imgEl = document.getElementById(`img-prod-${prodId}`);
            if(imgEl && imgUrl) {
                imgEl.src = imgUrl;
            }
        }

        function cambiarTalle(prodId, talle) {
            seleccionActual[prodId].talle = talle;
        }

        function addCart(prodId) {
            const p = db.productos.find(x => x.id === prodId);
            const s = seleccionActual[prodId] || { talle: p.talles[0], color: p.colores[0].id, qty: 1 };
            const col = p.colores.find(c => c.id === s.color) || p.colores[0];
            
            const key = `${prodId}|${s.color}|${s.talle}`;
            const ex = carrito.find(x => x.key === key);
            
            if (ex) ex.qty += 1;
            else {
                carrito.push({
                    key: key, prodNombre: p.nombre, colorNombre: col.nombre,
                    talle: s.talle, precio: p.precioBase, qty: 1, img: col.img || p.colores[0].img || 'https://via.placeholder.com/80'
                });
            }
            updateCartUI(); toast('Agregado al pedido');
            if(document.getElementById('modal-carrito').classList.contains('translate-x-full')) {
                toggleCart();
            }
        }

        function removeCartItem(key) { carrito = carrito.filter(x => x.key !== key); updateCartUI(); }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const totalItems = carrito.reduce((s, x) => s + x.qty, 0);
            badge.innerText = totalItems; badge.classList.toggle('hidden', totalItems === 0);

            const list = document.getElementById('lista-carrito');
            let total = 0;

            if (carrito.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-brand-text/40"><i class="fas fa-shopping-basket text-3xl mb-3 block"></i>Tu pedido está vacío.</div>`;
            } else {
                list.innerHTML = carrito.map(x => {
                    const sub = x.precio * x.qty; total += sub;
                    return `
                    <div class="flex gap-3 bg-white p-3 border border-brand-border rounded-xl relative shadow-sm items-center">
                        <img src="${x.img}" class="w-14 h-14 object-cover rounded-lg border border-brand-border">
                        <div class="flex-grow">
                            <h4 class="text-xs font-bold text-brand-text leading-tight line-clamp-1">${x.prodNombre}</h4>
                            <p class="text-[10px] text-gray-500 my-0.5">Color: ${x.colorNombre} | Talle: ${x.talle}</p>
                            <span class="text-xs font-black text-brand-accent">${x.qty} u. x ${formatMoney(x.precio)}</span>
                        </div>
                        <button onclick="removeCartItem('${x.key}')" class="text-gray-300 hover:text-red-500 p-2"><i class="fas fa-trash text-xs"></i></button>
                    </div>`
                }).join('');
            }
            document.getElementById('total-carrito').innerText = formatMoney(total);
        }

        function toggleCart() {
            document.getElementById('modal-carrito').classList.toggle('translate-x-full');
            document.getElementById('overlay').classList.toggle('hidden');
        }

        function enviarPedido() {
            if (!carrito.length) return toast('No hay productos en el pedido.');
            const nom = document.getElementById('cli-nombre').value.trim();
            const tel = document.getElementById('cli-tel').value.trim();
            if (!nom || !tel) return toast('Completá el nombre del local y teléfono.');
            
            let txt = `Hola Hippie Zapatos! Pedido para *${nom}* (${tel}):\n\n`;
            let t = 0;
            carrito.forEach(x => {
                const sub = x.precio * x.qty; t += sub;
                txt += `▪ ${x.qty}x ${x.prodNombre} (${x.colorNombre} - T: ${x.talle}) - ${formatMoney(sub)}\n`;
            });
            txt += `\n📦 *TOTAL: ${formatMoney(t)}*`;
            window.open(`https://wa.me/5491121586674?text=${encodeURIComponent(txt)}`, '_blank');
        }

        function generarExcelMuestra() {
            toast('Generando plantilla...');
            const data = [
                { "SKU": "1", "PRODUCTO": "Zuecos Mules Gamuza Con Hebilla Estribo Suela", "PRECIO": 35000, "TALLES": "35, 36, 37, 38, 39, 40, 41", "COLORES": "Suela, Beige, Chocolate" },
                { "SKU": "2", "PRODUCTO": "Zuecos Mules Rafia Doble Hebilla Tira", "PRECIO": 35000, "TALLES": "35, 36, 37, 38, 39, 40, 41", "COLORES": "Natural, Negro" }
            ];
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            ws['!cols'] = [{wch:10}, {wch:40}, {wch:12}, {wch:25}, {wch:25}];
            XLSX.utils.book_append_sheet(wb, ws, "Catalogo");
            XLSX.writeFile(wb, "Plantilla_Hippie_Zapatos.xlsx");
        }

        function subirFotosMasivas(e) {
            const files = e.target.files;
            if(!files.length) return;
            
            let cargadas = 0;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const base64 = evt.target.result;
                    const nombreLimpio = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    
                    const prod = db.productos.find(p => p.sku.toLowerCase() === nombreLimpio.toLowerCase());
                    if(prod && prod.colores.length > 0) {
                        prod.colores[0].img = base64; 
                    }
                    
                    cargadas++;
                    if(cargadas === files.length) {
                        salvar(); init();
                        toast(`¡${cargadas} imágenes asociadas con éxito! 📸`);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function importarExcel(e) {
            let f = e.target.files[0]; if(!f) return;
            document.getElementById('carga-overlay').style.display='flex';
            let r = new FileReader();
            r.onload = function(evt) {
                try {
                    let d = new Uint8Array(evt.target.result); let wb = XLSX.read(d, {type:'array'});
                    let sheet = wb.Sheets[wb.SheetNames[0]]; let json = XLSX.utils.sheet_to_json(sheet, {header:1});
                    let h = json[0].map(x=>String(x||'').toUpperCase().trim());
                    
                    let cSku = h.indexOf('SKU'), cProd = h.indexOf('PRODUCTO'), cPre = h.indexOf('PRECIO'), cTal = h.indexOf('TALLES'), cCol = h.indexOf('COLORES');
                    if(cSku===-1 || cProd===-1 || cPre===-1) throw new Error("Faltan columnas obligatorias (SKU, PRODUCTO, PRECIO).");
                    
                    let nuevosProductos = [];
                    for(let i=1; i<json.length; i++) {
                        let row = json[i]; if(!row || !row[cProd]) continue;
                        let sku = String(row[cSku]||i).trim();
                        let nombre = String(row[cProd]).trim();
                        let precio = parseFloat(String(row[cPre]).replace(',','.')) || 0;
                        let rawTalles = cTal !== -1 ? String(row[cTal]||'').split(',').map(x=>x.trim()).filter(x=>x) : ['Único'];
                        let rawColores = cCol !== -1 ? String(row[cCol]||'General').split(',').map(x=>x.trim()).filter(x=>x) : ['General'];
                        
                        let prodAnterior = db.productos.find(p => p.sku === sku);
                        let imgPrevia = prodAnterior && prodAnterior.colores[0] ? prodAnterior.colores[0].img : '';

                        let arrayColores = rawColores.map((c, idx) => {
                            return {
                                id: 'c-' + idx,
                                nombre: c,
                                img: idx === 0 ? imgPrevia : '' // La primera variante hereda la foto principal si la subió por SKU
                            };
                        });

                        nuevosProductos.push({
                            id: 'id-' + Date.now() + i,
                            sku: sku,
                            nombre: nombre,
                            precioBase: precio,
                            talles: rawTalles.length ? rawTalles : ['Único'],
                            colores: arrayColores
                        });
                    }
                    
                    if(nuevosProductos.length > 0) {
                        db.productos = nuevosProductos; salvar(); init(); 
                        toast("Excel importado con éxito ✅");
                    } else { toast("El Excel está vacío."); }
                } catch(err) { toast("❌ Error: " + err.message); } 
                finally { document.getElementById('carga-overlay').style.display='none'; e.target.value=''; }
            }; 
            r.readAsArrayBuffer(f);
        }

        function renderStockAdmin() {
            const b = document.getElementById('tbody-admin');
            b.innerHTML = db.productos.map(p => {
                const imgT = p.colores[0] && p.colores[0].img ? p.colores[0].img : 'https://via.placeholder.com/80';
                return `
                <tr class="hover:bg-stone-50 transition">
                    <td class="px-4 py-3"><img src="${imgT}" class="w-10 h-10 object-cover rounded border border-brand-border"></td>
                    <td class="px-4 py-3 font-mono text-xs font-bold">${p.sku}</td>
                    <td class="px-4 py-3 font-medium text-xs">${p.nombre}</td>
                    <td class="px-4 py-3 text-right font-bold text-brand-accent">${formatMoney(p.precioBase)}</td>
                    <td class="px-4 py-3 text-[11px] text-gray-500">Talles: [${p.talles.join(', ')}] | Colores: [${p.colores.map(c=>c.nombre).join(', ')}]</td>
                </tr>
            `}).join('');
        }

        function cerrarSesion() { document.body.classList.remove('modo-admin'); }
        function vaciarDB() { if(confirm('¿Seguro querés vaciar todo?')) { db.productos=[]; salvar(); init(); toast('Base vaciada.'); } }
        
        function toast(m) { 
            const c=document.getElementById('toast-container'), d=document.createElement('div'); 
            d.className='toast'; d.innerHTML=`<i class="fas fa-info-circle mr-2"></i> ${m}`; 
            c.appendChild(d); setTimeout(()=>{ d.style.animation='slideIn 0.3s reverse forwards'; setTimeout(()=>d.remove(),300); }, 3500); 
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
